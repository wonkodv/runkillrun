on: [push, pull_request]

name: Continuous integration

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Nix
        run: curl -L https://nixos.org/nix/install | sh
      - name: Build
        run: nix flake build
      - name: check
        run: nix flake check

